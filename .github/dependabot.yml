# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      # Exclude our own repos from cooldown
      # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown-
      exclude:
        - "org.jboss.da:*"
        - "org.jboss.pnc*:*"
    ignore:
      # NOTE: for Maven, Dependabot treats "versions" entries as Maven version requirements, so
      # a pattern like "6.x" is the literal version "6.x" and matches nothing. Use Maven range
      # syntax instead, e.g. "[7,)" = 7 and above. "update-types" is not affected.
      #
      # hibernate-validator 7.x+ switched from javax.* (Bean Validation 2.0) to jakarta.*
      # (Jakarta Bean Validation 3.0+), which is binary-incompatible with JBoss EAP 7.4's
      # runtime (providing Hibernate Validator 6.x and Java EE 8 javax.validation-api).
      # The safe ceiling is 6.2.x (latest: 6.2.6.Final).
      # Remove this exclusion when the project is upgraded/migrated to EAP 8 / Jakarta EE 10.
      - dependency-name: "org.hibernate.validator:hibernate-validator"
        versions: [ "[7,)" ]
      - dependency-name: "org.hibernate:hibernate-validator"
        versions: [ "[7,)" ]
      # jaxb-runtime 3.0+ switched from javax.xml.bind to jakarta.xml.bind. licenses-generator
      # and pig still use javax.xml.bind (11 files), so 3.x and 4.x have no provider for them.
      # The safe ceiling is 2.3.x (latest: 2.3.9).
      # Remove this exclusion when the code migrates to jakarta.xml.bind.
      - dependency-name: "org.glassfish.jaxb:jaxb-runtime"
        versions: [ "[3,)" ]
      # RESTEasy 4.x and later (and MicroProfile REST Client 3.x and later) moved from javax.*
      # to jakarta.*, which is binary-incompatible with Bacon and the PNC REST client
      # (rest-client, dto), both still built on javax.ws.rs and RESTEasy 3.15.x.
      # resteasy-client-microprofile and microprofile-rest-client-api are required at runtime
      # by the PNC rest-api client (org.jboss.pnc.client.ClientBase uses RestClientBuilder).
      # The safe ceiling is RESTEasy 3.15.x and MicroProfile REST Client 2.x.
      # Remove these exclusions when Bacon and the PNC client move to jakarta.ws.rs.
      - dependency-name: "org.jboss.resteasy:*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.eclipse.microprofile.rest.client:microprofile-rest-client-api"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: "github-actions" # Also update Github actions
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "project-ncl/shared-github-actions/*"
  - package-ecosystem: "github-actions" # Also update Github actions
    directory: "/"
    target-branch: "v3.5.x"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
